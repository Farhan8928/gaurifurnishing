         from script means a visitor with JavaScript disabled never gets the
         hidden state at all. The watchdog then covers the nastier case: the
         bundle 404s or a chunk fails on a weak connection, React never boots,
         and the sections would otherwise stay invisible forever. If nothing has
         set data-app-ready within four seconds, the class comes off and the
         page renders as plain, fully visible content. -->
    <script>
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        setTimeout(function () {
          if (!d.hasAttribute('data-app-ready')) d.classList.remove('js')
        }, 4000)
      })()
    </script>
